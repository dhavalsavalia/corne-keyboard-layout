layout:
  qmk_keyboard: corne_rotated
  layout_name: LAYOUT_split_3x6_3

layers:
  Base:
    - [↹, Q, W, E, R, T, Y, U, I, O, P, ESC]
    - [⌃, {t: A, h: ⌘}, {t: S, h: ⎇}, {t: D, h: ⌃}, {t: F, h: ⇧}, {t: G, h: Hyper}, {t: H, h: Hyper}, {t: J, h: ⇧}, {t: K, h: ⌃}, {t: L, h: ⎇}, {t: ";", h: ⌘}, "'"]
    - [⇧, Z, X, C, V, B, N, M, {t: ",", s: <}, {t: ".", s: ">"}, /, ⇧]
    - [{t: ⎋, h: ⌘}, {t: ⎵, h: Lower, type: held}, {t: ↹, h: ⎇}, {t: ⏎, h: Hyper}, ⌫, {t: Raise, type: held}]

  Lower:
    - [{t: ▽, type: trans}, "!", "@", "#", $, "%", ^, "&", "*", "(", ")", \]
    - [{t: ▽, type: trans}, "1", "2", "3", "4", "5", "-", {t: "=", h: ⇧}, {t: "`", h: ⌃}, {t: "[", h: ⎇}, {t: "]", h: ⌘}, "|"]
    - [{t: ▽, type: trans}, "6", "7", "8", "9", "0", _, +, "~", "{", "}", {t: ▽, type: trans}]
    - [{t: ▽, type: trans}, {type: held}, {t: ▽, type: trans}, {t: ▽, type: trans}, {t: ▽, type: trans}, {t: ▽, type: trans}]

  Raise:
    - [BOOT, F1, F2, F3, F4, F5, F6, F7, F8, F9, F10, {t: ▽, type: ghost}]
    - [{t: ▽, type: trans}, ⏮, ⏭, "$$mdi:volume-minus$$", "$$mdi:volume-plus$$", ⏯, ←, ↓, ↑, →, {t: ▽, type: ghost}, {t: ▽, type: ghost}]
    - [{t: ▽, type: trans}, BT1, BT2, BT3, BT4, BT5, "BT CLR", "BT CLR ALL", {t: ▽, type: ghost}, {t: ▽, type: ghost}, {t: ▽, type: ghost}, {t: ▽, type: trans}]
    - [{t: ▽, type: trans}, {t: ▽, type: trans}, {t: ▽, type: trans}, {t: ▽, type: trans}, {t: ▽, type: trans}, {type: held}]
